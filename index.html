<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>glm-overflow</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="root">
      <!-- Pill bar: selalu tampil di top layar; bisa didrag -->
      <div id="pill" data-tauri-drag-region title="Klik: detail · Drag: pindahkan">
        <span id="pill-chip">…</span>
        <div id="pill-bar"><div id="pill-fill"></div></div>
        <span id="pill-pct">…</span>
        <span id="pill-tok"></span>
        <span id="pill-reset"></span>
      </div>

      <!-- Panel detail: muncul saat pill diklik -->
      <div id="panel" class="hidden">
        <div class="panel-head">
          <span id="panel-title">Detail Langganan</span>
          <div class="panel-head-actions">
            <button id="btn-refresh" class="btn-mini" title="Refresh sekarang">↻</button>
            <button id="btn-collapse" class="btn-mini" title="Tutup (Esc)">✕</button>
          </div>
        </div>
        <div id="panel-rows"></div>
        <div id="panel-status"></div>

        <details id="settings">
          <summary>⚙ Settings</summary>
          <div class="settings-body">
            <label>
              <span>Provider</span>
              <select id="cfg-provider">
                <option value="glmprox">GLM Proxy (glmprox)</option>
                <option value="zai">Z.ai (API key langsung)</option>
              </select>
            </label>
            <div class="cfg-group" data-for="glmprox">
              <label>
                <span>API Token</span>
                <input id="cfg-token" type="password" autocomplete="off" spellcheck="false" />
              </label>
              <label>
                <span>Base URL</span>
                <input id="cfg-base-url" type="text" spellcheck="false" />
              </label>
            </div>
            <div class="cfg-group" data-for="zai">
              <label>
                <span>API Key Z.ai</span>
                <input id="cfg-zai-key" type="password" autocomplete="off" spellcheck="false" />
              </label>
              <p class="cfg-hint">
                Ambil API key di console Z.ai (z.ai → API Keys), butuh langganan
                GLM Coding aktif. Alternatif: env ZAI_API_KEY.
              </p>
            </div>
            <label>
              <span>Interval refresh (detik)</span>
              <input id="cfg-interval" type="number" min="10" max="3600" step="10" />
            </label>
            <label>
              <span>Theme</span>
              <select id="cfg-theme">
                <option value="dark">Dark</option>
                <option value="light">Light</option>
                <option value="midnight">Midnight</option>
                <option value="oled">OLED Black</option>
              </select>
            </label>
            <label class="check-row">
              <input id="cfg-compact" type="checkbox" />
              <span>Mode compact (pill kecil tanpa garis)</span>
            </label>
            <div class="settings-row">
              <button id="btn-save" class="btn">Simpan</button>
              <span id="save-status"></span>
            </div>
          </div>
        </details>

        <div class="update-row">
          <button id="btn-update" class="btn">Cek Update</button>
          <span id="update-status"></span>
        </div>

        <div class="panel-actions">
          <button id="btn-hide" class="btn">Sembunyikan bar</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
