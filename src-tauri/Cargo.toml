[package]
name = "glm-overflow"
version = "0.2.1"
description = "GLM coding plan usage bar — pill overlay + tray untuk Windows & Linux"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["time", "macros"] }
dirs = "6"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
